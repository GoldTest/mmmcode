# waygate-mmcode —— 反代 + 多账号管理（统一 Web 服务）
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f mmcode        # 首次启动这里会打印**管理密钥明文**
#   cat ~/.waygate/mmcode/admin.json     # 随时再查（状态目录与宿主机共用）
#
# ⚠️ 状态目录是**绑定挂载宿主的 ~/.waygate**，不是命名卷 —— 这样容器与宿主机上的
#    `mmcode` CLI 共用**同一份**凭证。MiniMax 的 refresh token 是一次性的，
#    两份拷贝会互相顶掉（表现为账号突然 401），所以必须只有一份状态。
#
# ⚠️ 端口暴露：默认只绑 127.0.0.1。管理页有密钥保护，但**反代入站密钥同样有效** ——
#    要放到局域网/公网请改成 "8789:8789" 并自行套 TLS + 防火墙。

services:
  mmcode:
    image: ghcr.io/goldtest/mmmcode:latest
    container_name: waygate-mmcode
    restart: unless-stopped

    # 以宿主用户身份运行 —— 绑定挂载的 ~/.waygate 归宿主机所有（uid 1000），
    # 容器内的默认用户（uid 100）写不进去。用 .env 里的 UID/GID 保持一致。
    user: "${WAYGATE_UID:-1000}:${WAYGATE_GID:-1000}"

    ports:
      - "127.0.0.1:8789:8789"

    volumes:
      # ★ 状态：账号、令牌、管理密钥、注册表。宿主机与容器共用同一份。
      - ${WAYGATE_STATE:-~/.waygate}:/data/.waygate

    environment:
      TZ: Asia/Shanghai
      MMCODE_HOME: /data/.waygate
      WAYGATE_HOME: /data/.waygate

    # ── 内存兜底（cgroup 硬闸）─────────────────────────────────────────
    # 为什么要它：Node 的堆上限（--max-old-space-size）是**软**的 ——
    #   堆外内存（Buffer / 原生对象 / undici 的连接缓冲）**不受**它管，
    #   一旦泄漏发生在堆外，V8 根本不会 GC，进程会一路涨到把宿主机拖垮。
    # cgroup 的 mem_limit 是**硬**的：撞到上限，内核直接 OOM-kill 这个容器，
    # 于是「泄漏再猛」也只会重启它自己，不会拖累整机。
    #
    # ★ memswap_limit 必须 ≥ mem_limit，否则容器启动即被拒。
    #   1g swap 给的是「短暂峰值」的缓冲空间（避免瞬时抖动就重启），
    #   但 swap 一旦用起来速度极慢 —— 它的作用是**别立刻死**，不是**随便涨**。
    mem_limit: 512m
    memswap_limit: 1g

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
