# Docker 镜像构建与发布。
#
# ## 版本策略：**Git tag 是版本的唯一真相**
#
#   · `vX.Y.Z` tag（推送）→ 发布该版本的正式镜像（`X.Y.Z` + `latest`）
#   · 推 main 分支      → 只构建不推送测试镜像（`main-<sha>`），供本地验证
#
# ## 为什么不入库 dist/
#
# `dist/` 是 `npm run build` 的产物，由 CI 在镜像内**从源码重新编译**。
# 入库只会让产物随代码漂移、污染 diff；版本由 tag 追溯，产物无需入库。
#
# ## 镜像标签
#
#   ghcr.io/goldtest/mmmcode:0.5.3        ← 由 v0.5.3 tag 触发（正式版）
#   ghcr.io/goldtest/mmmcode:latest       ← 指向最新正式版
#   ghcr.io/goldtest/mmmcode:main-<sha>   ← 推 main 时的临时构建（不覆盖 latest）
name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建测试
        run: npm run build

      - name: 校验构建产物
        run: |
          test -f dist/index.js
          test -f dist/web/index.html
          test -f dist/web/app.js

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
