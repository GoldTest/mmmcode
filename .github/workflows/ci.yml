# CI —— 每次 push / PR 都要过：类型检查 → 测试 → 构建。
#
# 这个项目改的是「协议翻译 + 凭证生命周期 + 自动换号」，
# 一次改动搞坏 SSE 帧形状或换号逻辑，在本机很难一眼看出来，
# 所以这三道关必须自动跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建（含静态页复制）
        run: npm run build

      - name: 校验构建产物
        run: |
          test -f dist/index.js
          test -f dist/web/index.html
          test -f dist/web/app.js
